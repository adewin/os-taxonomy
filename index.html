<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marble Skill Taxonomy — 本地可视化</title>
<script src="https://unpkg.com/3d-force-graph@1.73.0/dist/3d-force-graph.min.js"></script>
<style>
  :root { --bg:#0a0e17; --panel:#111826; --border:#1f2a3d; --text:#e8eef7; --dim:#8b9bb4; --accent:#5eb3f6; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
  #graph { position:fixed; inset:0; }
  .panel { position:fixed; background:rgba(17,24,38,.92); backdrop-filter:blur(10px); border:1px solid var(--border); border-radius:12px; z-index:10; }
  #header { top:16px; left:16px; padding:14px 18px; max-width:420px; }
  #header h1 { font-size:16px; font-weight:600; margin-bottom:4px; }
  #header p { font-size:12px; color:var(--dim); line-height:1.5; }
  #search { margin-top:10px; width:100%; padding:7px 10px; background:#0d1320; border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:13px; outline:none; }
  #search:focus { border-color:var(--accent); }
  #legend { top:16px; right:16px; padding:12px 16px; min-width:210px; }
  #legend .item { display:flex; align-items:center; gap:8px; font-size:12.5px; padding:3.5px 0; cursor:pointer; user-select:none; opacity:1; transition:opacity .2s; }
  #legend .item.off { opacity:.32; }
  #legend .dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
  #legend .count { margin-left:auto; color:var(--dim); font-size:11px; }
  #legend .hint { margin-top:8px; padding-top:8px; border-top:1px solid var(--border); font-size:11px; color:var(--dim); line-height:1.5; }
  #info { top:50%; right:16px; transform:translateY(-50%); width:340px; max-height:78vh; padding:18px; display:none; overflow-y:auto; }
  #info.show { display:block; }
  #info .badge { display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600; margin-bottom:8px; }
  #info h2 { font-size:16px; margin-bottom:4px; }
  #info .domain { font-size:12px; color:var(--dim); margin-bottom:10px; }
  #info .section { margin-top:12px; }
  #info .section h3 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin-bottom:5px; }
  #info .desc { font-size:12.5px; line-height:1.55; }
  #info ul { padding-left:16px; font-size:12px; line-height:1.5; color:#c3d0e2; }
  #info .edge { font-size:12px; padding:6px 0; border-bottom:1px solid var(--border); cursor:pointer; }
  #info .edge:hover { color:var(--accent); }
  #info .edge .reason { font-size:11px; color:var(--dim); display:block; margin-top:2px; }
  #info .close { position:absolute; top:10px; right:12px; cursor:pointer; color:var(--dim); font-size:16px; }
  #info .close:hover { color:var(--text); }
  #status { bottom:14px; left:16px; padding:6px 12px; font-size:11px; color:var(--dim); }
  #loading { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; background:var(--bg); gap:14px; }
  #loading .spinner { width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loading p { font-size:13px; color:var(--dim); }
  #age-labels { position:fixed; left:8px; top:0; bottom:0; width:30px; z-index:5; pointer-events:none; }
  #age-labels div { position:absolute; font-size:10px; color:#3d4d68; transform:translateY(-50%); }
</style>
</head>
<body>
<div id="graph"></div>

<div id="header" class="panel">
  <h1>Marble Skill Taxonomy v1</h1>
  <p id="subtitle">加载中…</p>
  <input id="search" type="text" placeholder="搜索知识点 (name / 学科 / 领域)…">
</div>

<div id="legend" class="panel"></div>
<div id="info" class="panel"></div>
<div id="status" class="panel"></div>
<div id="age-labels"></div>

<div id="loading">
  <div class="spinner"></div>
  <p>正在加载 1,590 个知识点与 3,221 条前置依赖…</p>
</div>

<script>
const SUBJECT_COLORS = {
  'Science': '#4f9df7', 'Mathematics': '#f7a24f', 'English': '#e0618f',
  'History': '#b08ef7', 'Personal & Social Development': '#5fd6a2',
  'Life Skills': '#d6d65f', 'Computing': '#67e0e8', 'Learning to Learn': '#9aa5b1'
};
const TYPE_LABELS = { CONCEPTUAL:'概念', PROCEDURAL:'程序/技能', REPRESENTATIONAL:'表征', LANGUAGE:'语言', META:'元认知' };

const AGE_MIN = 3, AGE_MAX = 14, R = 190, Y_TOP = 75, Y_BOTTOM = -75;
const ageToY = a => Y_TOP - (a - AGE_MIN) / (AGE_MAX - AGE_MIN) * (Y_TOP - Y_BOTTOM);

let Graph, nodes, links, byId = new Map(), neighbors = new Map(), prereqsOf = new Map(), unlocksOf = new Map();
const subjectOn = {};

async function load() {
  const [t, d, m] = await Promise.all(['topics','dependencies','manifest'].map(f => fetch('data/'+f+'.json').then(r => { if(!r.ok) throw new Error(f+': '+r.status); return r.json(); })));
  const topics = t.topics, deps = d.dependencies;
  const counts = {};
  topics.forEach(tp => counts[tp.subject] = (counts[tp.subject]||0)+1);
  document.getElementById('subtitle').textContent =
    `${t.topics.length} 个微知识点 · ${d.dependencies.length} 条前置依赖 · ${m.counts.curricula} 套课标 · 8 个学科。每个点一个知识点，颜色=学科，高度=年龄；拖拽旋转 / 滚轮缩放 / 点击查看详情。`;
  document.getElementById('loading').style.display = 'none';
  buildGraph(topics, deps, counts);
  document.getElementById('status').textContent = `1590 节点 / ${d.dependencies.length} 边 · 布局计算中…`;
}

function buildGraph(topics, deps, counts) {
  nodes = topics.map(tp => {
    const age = (tp.ageRangeStart + tp.ageRangeEnd) / 2;
    return { id: tp.id, name: tp.name, subject: tp.subject, domain: tp.domain,
      type: tp.type, desc: tp.description, age, ageRange: `${tp.ageRangeStart}–${tp.ageRangeEnd}`,
      evidence: tp.evidence || [], standards: tp.standards || [], centrality: tp.centrality,
      assessmentPrompt: tp.assessmentPrompt, x: 0, y: ageToY(age), z: 0 };
  });
  byId = new Map(nodes.map(n => [n.id, n]));
  links = deps.map(dd => ({ source: dd.topicId, target: dd.prerequisiteId, strength: dd.strength, reason: dd.reason }));
  nodes.forEach(n => { neighbors.set(n.id, new Set()); prereqsOf.set(n.id, []); unlocksOf.set(n.id, []); });
  links.forEach(l => {
    neighbors.get(l.source).add(l.target);
    prereqsOf.get(l.source).push(l);
    unlocksOf.get(l.target).push(l);
  });
  renderLegend(counts);
  start();
}

function renderLegend(counts) {
  const el = document.getElementById('legend');
  const subs = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  el.innerHTML = subs.map(([s, c]) => {
    subjectOn[s] = true;
    return `<div class="item" data-sub="${s}"><span class="dot" style="background:${SUBJECT_COLORS[s]||'#888'}"></span>${s}<span class="count">${c}</span></div>`;
  }).join('') + '<div class="hint">点击学科可显示/隐藏。<br>点击节点查看依赖链。</div>';
  el.querySelectorAll('.item').forEach(it => it.onclick = () => {
    const s = it.dataset.sub; subjectOn[s] = !subjectOn[s]; it.classList.toggle('off', !subjectOn[s]);
    applyFilter();
  });
}

function start() {
  const W = innerWidth, H = innerHeight;
  Graph = new ForceGraph3D()(document.getElementById('graph'))
    .width(W).height(H)
    .graphData({ nodes, links })
    .nodeId('id')
    .nodeVal(n => 1.2 + (n.centrality||0) * 5)
    .nodeColor(n => (subjectOn[n.subject] && !n.hidden) ? (SUBJECT_COLORS[n.subject] || '#888') : 'rgba(120,135,160,0.05)')
    .nodeLabel(n => `<b>${n.name}</b><br>${n.subject} · ${n.domain}<br>年龄 ${n.ageRange}`)
    .nodeOpacity(1)
    .linkColor(l => l.highlight ? (l.strength === 'hard' ? '#5eb3f6' : 'rgba(94,179,246,0.45)') : 'rgba(120,140,170,0.10)')
    .linkWidth(l => l.highlight ? 1.4 : 0.25)
    .linkOpacity(1)
    .linkDirectionalArrowLength(0)
    .showNavInfo(false)
    .d3Force('charge', Graph.d3Force('charge').strength(-3.2))
    .d3Force('link', Graph.d3Force('link').distance(14).strength(0.12))
    .d3Force('x', Graph.d3Force('x').strength(0.04))
    .d3Force('z', Graph.d3Force('z').strength(0.04))
    .d3Force('collide', Graph.d3Force('collide').radius(4.5))
    .onNodeClick(n => showInfo(n))
    .onBackgroundClick(() => { document.getElementById('info').classList.remove('show'); clearHighlight(); });
  // freeze Y (age) axis: re-pin every tick so height stays semantic
  const origTick = Graph.d3VelocityDecay();
  Graph.d3Force('y', null);
  Graph.onEngineTick(() => { nodes.forEach(n => { if (n.y === undefined) n.y = ageToY(n.age); }); });
  Graph.autoPause(false).coolDownTicks(280).warmupTicks(60);
  Graph.camera({ x: 0, y: 0, z: 420 });
  // gentle auto-rotate until first interaction
  let auto = true;
  const spin = () => { if (auto && !document.hidden) Graph.camera({ ...Graph.camera(), x: Graph.camera().x * Math.cos(0.0022) + Graph.camera().z * Math.sin(0.0022), z: -Graph.camera().x * Math.sin(0.0022) + Graph.camera().z * Math.cos(0.0022) }); requestAnimationFrame(spin); };
  ['pointerdown','wheel'].forEach(ev => addEventListener(ev, () => { auto = false; }, { once: true, passive: true }));
  spin();
  addEventListener('resize', () => Graph.width(innerWidth).height(innerHeight));
  // age axis labels
  const al = document.getElementById('age-labels');
  for (let a = AGE_MIN; a <= AGE_MAX; a += 3) al.innerHTML += `<div style="top:${(ageToY(a)/Y_TOP*0.5+0.5)*100}%">${a}岁</div>`;
  setTimeout(() => document.getElementById('status').textContent = '1590 节点 / 3221 边 · 就绪', 8000);
}

function clearHighlight() {
  nodes.forEach(n => n.hidden = false);
  links.forEach(l => l.highlight = false);
  Graph.nodeColor(Graph.nodeColor()).linkColor(Graph.linkColor()).linkWidth(Graph.linkWidth()).refresh();
}

function applyFilter() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  nodes.forEach(n => n.hidden = !subjectOn[n.subject] || (q && !(`${n.name} ${n.subject} ${n.domain} ${n.type}`.toLowerCase().includes(q))));
  links.forEach(l => { const a = l.source.id ?? l.source, b = l.target.id ?? l.target; const sa = byId.get(a), sb = byId.get(b); l.highlight = !!(sa && sb && !sa.hidden && !sb.hidden && q); });
  Graph.nodeColor(Graph.nodeColor()).linkColor(Graph.linkColor()).linkWidth(Graph.linkWidth()).refresh();
}

function showInfo(n) {
  const panel = document.getElementById('info');
  const pre = prereqsOf.get(n.id) || [];
  const un = unlocksOf.get(n.id) || [];
  const col = SUBJECT_COLORS[n.subject] || '#8892a8';
  const edgeHTML = (list, label) => list.length ? `<div class="section"><h3>${label} (${list.length})</h3>` + list.slice(0, 40).map(l => {
    const otherId = label.includes('前置') ? l.prerequisiteId : l.topicId;
    const other = byId.get(otherId);
    return other ? `<div class="edge" data-id="${other.id}">${other.name}${l.reason ? `<span class="reason">${l.strength === 'hard' ? '硬性 · ' : '软性 · '}${l.reason}</span>` : ''}</div>` : '';
  }).join('') + '</div>' : '';
  panel.innerHTML = `<span class="close">✕</span>
    <span class="badge" style="background:${col}22;color:${col};border:1px solid ${col}55">${n.subject}</span>
    <h2>${n.name}</h2>
    <div class="domain">${n.domain} · ${TYPE_LABELS[n.type] || n.type} · 年龄 ${n.ageRange}</div>
    ${n.desc ? `<div class="section"><h3>描述</h3><div class="desc">${n.desc}</div></div>` : ''}
    ${n.evidence.length ? `<div class="section"><h3>掌握证据</h3><ul>${n.evidence.map(e => `<li>${e}</li>`).join('')}</ul></div>` : ''}
    ${edgeHTML(pre, '前置依赖')}
    ${edgeHTML(un, '解锁后续')}
    ${n.standards.length ? `<div class="section"><h3>课标对齐</h3><ul>${n.stards = n.standards.map(s => `<li style="font-family:monospace;font-size:11px">${s}</li>`).join('')}</ul></div>` : ''}`;
  panel.classList.add('show');
  panel.querySelector('.close').onclick = () => panel.classList.remove('show');
  panel.querySelectorAll('.edge').forEach(e => e.onclick = () => { const t = byId.get(e.dataset.id); if (t) { showInfo(t); Graph.centerAt(t.x, t.y, t.z, 600); } });
}

document.getElementById('search').addEventListener('input', applyFilter);
load().catch(e => { document.getElementById('loading').innerHTML = `<p style="color:#f66">加载失败: ${e.message}</p>`; });
</script>
</body>
</html>
